services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-finance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance}
      POSTGRES_DB: ${DB_NAME:-finance_tracker}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-finance}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis is here for later (BullMQ async import processing). Not used yet.
  redis:
    image: redis:7-alpine
    container_name: finance_tracker_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
